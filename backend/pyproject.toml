[project]
name = "topiclens-backend"
version = "0.1.0"
description = "Backend & AI pipeline for TopicLens AI: Semantic clustering and topic discovery with UMAP and HDBSCAN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.12",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
    "fastembed>=0.3.6",
    "litellm>=1.49.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
